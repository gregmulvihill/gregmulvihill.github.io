<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greg Mulvihill — Releases</title>
<style>
  :root { --bg:#fff; --fg:#1f2328; --muted:#59636e; --line:#d1d9e0; --card:#f6f8fa; --link:#0969da; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --line:#3d444d; --card:#151b23; --link:#4493f8; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:860px; margin:0 auto; padding:32px 16px 64px; }
  h1 { margin:0 0 4px; font-size:28px; }
  .sub { color:var(--muted); margin:0 0 32px; }
  a { color:var(--link); }
  .tool { border:1px solid var(--line); border-radius:8px; background:var(--card);
          padding:16px 20px; margin:0 0 20px; }
  .tool h2 { margin:0; font-size:20px; }
  .meta { color:var(--muted); font-size:14px; margin:2px 0 10px; }
  .notes { white-space:pre-wrap; margin:0 0 12px; font-size:15px; }
  ul.assets { list-style:none; padding:0; margin:0 0 8px; }
  ul.assets li { padding:4px 0; border-top:1px solid var(--line); display:flex;
                 justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .size { color:var(--muted); font-size:14px; }
  details { font-size:14px; color:var(--muted); }
  details li { margin:2px 0; }
  .status { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Greg Mulvihill</h1>
  <p class="sub">Software I build, free to download.
    <a href="https://github.com/gregmulvihill">GitHub</a> ·
    <a href="https://www.linkedin.com/in/gregmulvihill/">LinkedIn</a></p>
  <div id="list"><p class="status">Loading releases…</p></div>
</main>
<script src="releases.js"></script>
</body>
</html>
